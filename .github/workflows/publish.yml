name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bypass the version-bump check and publish anyway"
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for version bump
        id: check
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          old_version=$(git show HEAD^:pyproject.toml 2>/dev/null | grep -m1 '^version = ' | cut -d '"' -f2 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_PUBLISH" = "true" ] || [ "$version" != "$old_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Test grammar
        run: npx tree-sitter test

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.2.*

      - name: Install project dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest --cov=tree_sitter_gosu tests --cov-report term

      - name: Build sdist (Linux)
        if: runner.os == 'Linux'
        run: poetry build --format sdist

      - name: Clean in-place build artifacts (Linux)
        if: runner.os == 'Linux'
        run: rm -rf build tree_sitter_gosu/_binding*.so

      - name: Build manylinux wheel (Linux)
        if: runner.os == 'Linux'
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: dist
        env:
          CIBW_BUILD: cp314-manylinux_x86_64
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: "pip install -U 'poetry-core>=2.0.0,<3.0.0' 'setuptools>=84.0.0'"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Build package (Windows/macOS)
        if: runner.os != 'Linux'
        run: poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Publish to PyPI
        run: |
          pip install twine
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}